<!DOCTYPE html>
<html
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:h="jakarta.faces.html"
  xmlns:cc="jakarta.faces.composite"
  xmlns:p="primefaces"
>
<!--
  The "Sign up" popup. It lives in the shared layout, so every page has it. Open it with
  PF('signupDialog').show(). A successful sign up logs you in and reloads the current page.
-->
<cc:interface>
</cc:interface>

<cc:implementation>
  <p:dialog header="Create your account" widgetVar="signupDialog" modal="true" appendTo="@(body)" dynamic="false"
            draggable="false" resizable="false" responsive="true" closeOnEscape="true"
            showEffect="fade" hideEffect="fade" width="28rem">
    <h:form id="signupForm" styleClass="flex flex-col gap-5">
      <p class="muted text-sm">Write, follow and save articles.</p>

      <div class="flex flex-col gap-2">
        <p:outputLabel for="username" value="Username" />
        <p:inputText id="username" value="#{userSessionBean.newUser.username}" maxlength="30" styleClass="w-full" autocomplete="username" />
        <small class="muted">3 to 30 letters, numbers or underscores.</small>
      </div>
      <div class="flex flex-col gap-2">
        <p:outputLabel for="displayName" value="Display name (optional)" />
        <p:inputText id="displayName" value="#{userSessionBean.newUser.displayName}" maxlength="100" styleClass="w-full" />
      </div>
      <div class="flex flex-col gap-2">
        <p:outputLabel for="email" value="Email" />
        <p:inputText id="email" value="#{userSessionBean.newUser.email}" maxlength="255" styleClass="w-full" autocomplete="email" />
      </div>
      <div class="flex flex-col gap-2">
        <p:outputLabel for="password" value="Password" />
        <p:password id="password" value="#{userSessionBean.newUser.rawPassword}" toggleMask="true" feedback="false" styleClass="w-full" autocomplete="new-password" />
        <small class="muted">At least 6 characters.</small>
      </div>

      <p:defaultCommand target="signupButton" />
      <p:commandButton id="signupButton" value="Create account" icon="pi pi-user-plus" action="#{userSessionBean.signup}"
                       process="@form" update="@form :growl" styleClass="w-full" />

      <p class="muted text-center text-sm">
        Already have an account?
        <a href="#" class="link font-semibold text-cold" onclick="PF('signupDialog').hide(); PF('loginDialog').show(); return false;">Log in</a>
      </p>
    </h:form>
  </p:dialog>
</cc:implementation>
</html>
