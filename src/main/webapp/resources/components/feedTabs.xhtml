<!DOCTYPE html>
<html
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:h="jakarta.faces.html"
  xmlns:cc="jakarta.faces.composite"
  xmlns:p="primefaces"
>
<cc:interface>
  <cc:attribute name="active" required="true" />
</cc:interface>

<cc:implementation>
  <h:form styleClass="mb-5">
    <p:tabMenu activeIndex="#{cc.attrs.active == 'popular' ? 1 : 0}">
      <p:menuitem value="Latest" icon="pi pi-clock" url="#{nav.home}" />
      <p:menuitem value="Popular" icon="pi pi-chart-line" url="#{nav.popular}" />
    </p:tabMenu>
  </h:form>
</cc:implementation>
</html>
