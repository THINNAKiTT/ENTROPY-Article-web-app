<!DOCTYPE html>
<html
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:h="jakarta.faces.html"
  xmlns:ui="jakarta.faces.facelets"
  xmlns:cc="jakarta.faces.composite"
  xmlns:p="primefaces"
>
<cc:interface>
</cc:interface>

<cc:implementation>
  <p:card title="Topics" rendered="#{not empty topics.popular}">
    <div class="flex flex-wrap gap-2">
      <ui:repeat value="#{topics.popular}" var="t">
        <h:outputLink value="#{nav.tag(t.slug)}">
          <p:tag value="#{t.name} (#{t.count})" severity="info" rounded="true" />
        </h:outputLink>
      </ui:repeat>
    </div>
  </p:card>
</cc:implementation>
</html>
