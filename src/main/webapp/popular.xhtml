<!DOCTYPE html>
<html
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:h="jakarta.faces.html"
  xmlns:f="jakarta.faces.core"
  xmlns:ui="jakarta.faces.facelets"
  xmlns:comp="jakarta.faces.composite/components"
>
<ui:composition template="/WEB-INF/templates/layout.xhtml">
  <ui:define name="title">Popular - Entropy</ui:define>

  <ui:define name="content">
    <comp:feedLayout>
      <comp:feedTabs active="popular" />

      <comp:articleGrid items="#{popularBean.articles}" owner="#{popularBean}">
        <f:facet name="whenEmpty">
          <comp:emptyState icon="pi pi-chart-line" title="Nothing is popular yet."
                           text="Nothing Here!"
                           actionLabel="See articles" actionIcon="pi pi-clock" actionHref="#{nav.home}" />
        </f:facet>
      </comp:articleGrid>
    </comp:feedLayout>
  </ui:define>
</ui:composition>
</html>
