<!DOCTYPE html>
<html
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:h="jakarta.faces.html"
  xmlns:f="jakarta.faces.core"
  xmlns:ui="jakarta.faces.facelets"
  xmlns:comp="jakarta.faces.composite/components"
>
<ui:composition template="/WEB-INF/templates/layout.xhtml">
  <ui:define name="title">Entropy</ui:define>

  <ui:define name="content">
    <comp:feedLayout>
      <comp:feedTabs active="latest" />

      <comp:articleGrid items="#{homeBean.articles}" owner="#{homeBean}">
        <f:facet name="whenEmpty">
          <h:panelGroup>
            <comp:emptyState rendered="#{userSessionBean.loggedIn}" title="No articles yet."
                             actionLabel="Write the first one" actionIcon="pi pi-pencil" actionHref="#{nav.write}" />
            <comp:emptyState rendered="#{!userSessionBean.loggedIn}" title="No articles yet."
                             actionLabel="Create an account to write" actionIcon="pi pi-user-plus" actionOnclick="PF('signupDialog').show()" />
          </h:panelGroup>
        </f:facet>
      </comp:articleGrid>
    </comp:feedLayout>
  </ui:define>
</ui:composition>
</html>
