<!DOCTYPE html>
<html
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:h="jakarta.faces.html"
  xmlns:f="jakarta.faces.core"
  xmlns:ui="jakarta.faces.facelets"
  xmlns:p="primefaces"
  xmlns:comp="jakarta.faces.composite/components"
>
<f:metadata>
  <f:viewParam name="q" value="#{searchBean.q}" />
</f:metadata>

<ui:composition template="/WEB-INF/templates/layout.xhtml">
  <ui:define name="title">Search - Entropy</ui:define>

  <ui:define name="content">
    <comp:feedLayout>
      <div class="mb-5 flex flex-wrap items-center gap-3">
        <h1 class="text-2xl font-bold tracking-tight">
          Results for &#8220;<h:outputText value="#{searchBean.q}" />&#8221;
        </h1>
        <p:button href="#{nav.latest}" value="Clear tag" icon="pi pi-times" styleClass="ui-button-outlined ui-button-secondary ui-button-sm" />
      </div>

      <comp:articleGrid items="#{searchBean.articles}" owner="#{searchBean}">
        <f:facet name="whenEmpty">
          <comp:emptyState icon="pi pi-search" title="Nothing matches that."
                           text="Try a different word, or look at everything."
                           actionLabel="Clear tags" actionIcon="pi pi-book" actionHref="#{nav.latest}" />
        </f:facet>
      </comp:articleGrid>
    </comp:feedLayout>
  </ui:define>
</ui:composition>
</html>
