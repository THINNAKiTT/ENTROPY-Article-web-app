<!DOCTYPE html>
<html
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:h="jakarta.faces.html"
  xmlns:f="jakarta.faces.core"
  xmlns:ui="jakarta.faces.facelets"
  xmlns:p="primefaces"
  xmlns:comp="jakarta.faces.composite/components"
>
<f:metadata>
  <f:viewParam name="slug" value="#{tagBean.slug}" />
</f:metadata>

<ui:composition template="/WEB-INF/templates/layout.xhtml">
  <ui:define name="title"><h:outputText value="#{tagBean.name}" /> - Entropy</ui:define>

  <ui:define name="content">
    <comp:feedLayout>
      <div class="mb-5 flex flex-wrap items-center gap-3">
        <h1 class="text-2xl font-bold tracking-tight">Topic: <h:outputText value="#{tagBean.name}" /></h1>
        <p:button href="#{nav.home}" value="Clear tag" icon="pi pi-times" styleClass="ui-button-outlined ui-button-secondary ui-button-sm" />
      </div>

      <comp:articleGrid items="#{tagBean.articles}" owner="#{tagBean}">
        <f:facet name="whenEmpty">
          <comp:emptyState icon="pi pi-tag" title="No articles with this topic yet."
                           actionLabel="Clear tag" actionIcon="pi pi-book" actionHref="#{nav.home}" />
        </f:facet>
      </comp:articleGrid>
    </comp:feedLayout>
  </ui:define>
</ui:composition>
</html>
